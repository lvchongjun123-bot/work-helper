<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>工作小助手</title>

<meta name="theme-color" content="#0067a0">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

<body>
<div class="app">
  <aside class="sidebar" aria-label="侧边栏">
    <div class="brand">

      </span>
      <div class="brandtext">
        <strong id="brandName">工作小助手</strong>
        <span id="brandSub">私有内容</span>
      </div>
    </div>
    <nav class="sidenav" aria-label="主导航">
      <a class="navitem" data-nav="flow" href="#/flow">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path d="M8 8.6h8M8 12h8M8 15.4h5"/><path class="tick" d="M7 11.9l1.4 1.4 2.3-2.6"/></svg>
        <span>流程</span>
      </a>
      <a class="navitem" data-nav="memory" href="#/memory">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="13" height="14" rx="3"/><path d="M9 4.5h8.5a2 2 0 0 1 2 2V17"/><path d="M10.5 11h5M10.5 14.5h5"/></svg>
        <span>背诵</span>
      </a>
      <a class="navitem" data-nav="ref" href="#/ref">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 6.2A2.7 2.7 0 0 1 7.2 3.5H19.5v14.3H7.2a2.7 2.7 0 0 0-2.7 2.7V6.2Z"/><path d="M4.5 20.5V6.2"/><path d="M8.5 8h7M8.5 11.3h7"/></svg>
        <span>速查</span>
      </a>
      <a class="navitem" data-nav="edit" href="#/edit">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M18.5 7H20M4 12h2M10.5 12H20M4 17h6M15.5 17H20"/><circle cx="15.5" cy="7" r="2.2"/><circle cx="7.5" cy="12" r="2.2"/><circle cx="13" cy="17" r="2.2"/></svg>
        <span>编辑</span>
      </a>
    </nav>
    <div class="sidefoot">
      <span class="verchip" id="verChip">🔒 已加密</span>
      <p>内容加密存储<br>仅供个人使用</p>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-brand">
        <span class="brandmark small" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="28" height="28"><rect width="48" height="48" rx="12" fill="#0067a0"/><path d="M24 8 L40 24 L24 40 L8 24 Z" fill="#fff"/><path d="M15.5 24.6l5.6 5.6 11.4-11.8" fill="none" stroke="#0067a0" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <div class="topbar-title">
          <strong id="topTitle">工作小助手</strong>
          <span id="topbarSub">私有内容 · 密码解锁</span>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="todaychip" id="todayChip"></span>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar" aria-label="底部导航">
    <a class="tabitem" data-nav="flow" href="#/flow">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path d="M8 8.6h8M8 12h8M8 15.4h5"/><path class="tick" d="M7 11.9l1.4 1.4 2.3-2.6"/></svg>
      <span>流程</span>
    </a>
    <a class="tabitem" data-nav="memory" href="#/memory">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="13" height="14" rx="3"/><path d="M9 4.5h8.5a2 2 0 0 1 2 2V17"/><path d="M10.5 11h5M10.5 14.5h5"/></svg>
      <span>背诵</span>
    </a>
    <a class="tabitem" data-nav="ref" href="#/ref">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 6.2A2.7 2.7 0 0 1 7.2 3.5H19.5v14.3H7.2a2.7 2.7 0 0 0-2.7 2.7V6.2Z"/><path d="M4.5 20.5V6.2"/><path d="M8.5 8h7M8.5 11.3h7"/></svg>
      <span>速查</span>
    </a>
    <a class="tabitem" data-nav="edit" href="#/edit">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M18.5 7H20M4 12h2M10.5 12H20M4 17h6M15.5 17H20"/><circle cx="15.5" cy="7" r="2.2"/><circle cx="7.5" cy="12" r="2.2"/><circle cx="13" cy="17" r="2.2"/></svg>
      <span>编辑</span>
    </a>
  </nav>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close="1"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip" aria-hidden="true"></div>
    <button class="sheet-close" data-close="1" aria-label="关闭">✕</button>
    <div id="sheetBody"></div>
  </div>
</div>

<script src="./assets/js/secure-data.js"></script>
<script src="./assets/js/app.js"></script>

</html>
