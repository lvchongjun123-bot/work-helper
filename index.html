<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<body>
<div class="app">

        <svg viewBox="0 0 48 48" width="34" height="34"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b6fc4"/><stop offset="1" stop-color="#0058a3"/></linearGradient></defs><rect width="48" height="48" rx="12" fill="url(#bg)"/><rect x="14" y="11" width="20" height="27" rx="4" fill="#fff"/><rect x="19" y="8.5" width="10" height="6" rx="2.4" fill="#ffc220"/><path d="M18.5 25.5l3.6 3.6 7.4-8" fill="none" stroke="#0058a3" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <div class="brandtext">
        <strong id="brandName">工作小助手</strong>
        <span id="brandSub">私有内容</span>
      </div>
    </div>
    <nav class="sidenav" aria-label="主导航">
      <a class="navitem" data-nav="flow" href="#/flow">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path d="M8 8.6h8M8 12h8M8 15.4h5"/><path class="tick" d="M7 11.9l1.4 1.4 2.3-2.6"/></svg>
        <span>流程</span>
      </a>
      <a class="navitem" data-nav="memory" href="#/memory">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="13" height="14" rx="3"/><path d="M9 4.5h8.5a2 2 0 0 1 2 2V17"/><path d="M10.5 11h5M10.5 14.5h5"/></svg>
        <span>背诵</span>

      <a class="navitem" data-nav="ref" href="#/ref">

        <span>速查</span>

    <div class="sidefoot">
      <span class="verchip" id="verChip">🔒 已加密</span>
      <p>内容加密存储<br>仅供个人使用</p>

  <div class="main">

        </span>
        <div class="topbar-title">
          <strong id="topTitle">工作小助手</strong>
          <span id="topbarSub">私有内容 · 密码解锁</span>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="todaychip" id="todayChip"></span>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar" aria-label="底部导航">
    <a class="tabitem" data-nav="flow" href="#/flow">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path d="M8 8.6h8M8 12h8M8 15.4h5"/><path class="tick" d="M7 11.9l1.4 1.4 2.3-2.6"/></svg>

      <span>速查</span>
    </a>
  </nav>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close="1"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip" aria-hidden="true"></div>
    <button class="sheet-close" data-close="1" aria-label="关闭">✕</button>
    <div id="sheetBody"></div>
  </div>
</div>

<script src="./assets/js/secure-data.js"></script>
<script src="./assets/js/app.js"></script>
